# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          25,    # Current Java LTS & minimum supported by Minecraft
        ]
        # and run on both Linux and Windows
        # os: [ubuntu-20.04, windows-2022]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:

      ### Set up ###

      - name: Checkout the CommandAPI repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # By default, only the default branch (master) writes to the cache, but development happens on other branches
          cache-read-only: false

      - name: Checkout the BytecodeAnalyser repository
        run: |
            git clone https://github.com/CommandAPI/BytecodeAnalyser.git
            cd BytecodeAnalyser
            commitHash=$(git rev-parse HEAD)
            echo "$commitHash"

      - name: Compile BytecodeAnalyser using Gradle
        run: |
            cd BytecodeAnalyser
            ./gradlew jar

      ### Compilation ###

      - name: Build the CommandAPI (Bukkit+Velocity) using Gradle
        run: ./gradlew build publishToMavenLocal

      ### Check NMS_Common compiles against all compatible Minecraft versions

      - name: Compile NMS_Common for 1.20 and 1.20.1
        run: ./gradlew :commandapi-bukkit-nms-common:clean :commandapi-bukkit-nms-common:build -PnmsCommonVersion=1.20.1

      - name: Compile NMS_Common for 1.20.2
        run: ./gradlew :commandapi-bukkit-nms-common:clean :commandapi-bukkit-nms-common:build -PnmsCommonVersion=1.20.2

      - name: Compile NMS_Common for 1.20.3 and 1.20.4
        run: ./gradlew :commandapi-bukkit-nms-common:clean :commandapi-bukkit-nms-common:build -PnmsCommonVersion=1.20.4

      - name: Compile NMS_Common for 1.20.5 and 1.20.6
        run: ./gradlew :commandapi-bukkit-nms-common:clean :commandapi-bukkit-nms-common:build -PnmsCommonVersion=1.20.6

      - name: Compile NMS_Common for 1.21 and 1.21.1
        run: ./gradlew :commandapi-bukkit-nms-common:clean :commandapi-bukkit-nms-common:build -PnmsCommonVersion=1.21.1

      - name: Compile NMS_Common for 1.21.2 and 1.21.3
        run: ./gradlew :commandapi-bukkit-nms-common:clean :commandapi-bukkit-nms-common:build -PnmsCommonVersion=1.21.3

      - name: Compile NMS_Common for 1.21.4
        run: ./gradlew :commandapi-bukkit-nms-common:clean :commandapi-bukkit-nms-common:build -PnmsCommonVersion=1.21.4

      - name: Compile NMS_Common for 1.21.5
        run: ./gradlew :commandapi-bukkit-nms-common:clean :commandapi-bukkit-nms-common:build -PnmsCommonVersion=1.21.5

      - name: Compile NMS_Common for 1.21.6 and 1.21.7 and 1.21.8
        run: ./gradlew :commandapi-bukkit-nms-common:clean :commandapi-bukkit-nms-common:build -PnmsCommonVersion=1.21.6

      - name: Compile NMS_Common for 1.21.9 and 1.21.10
        run: ./gradlew :commandapi-bukkit-nms-common:clean :commandapi-bukkit-nms-common:build -PnmsCommonVersion=1.21.9

      - name: Compile NMS_Common for 1.21.11
        run: ./gradlew :commandapi-bukkit-nms-common:clean :commandapi-bukkit-nms-common:build -PnmsCommonVersion=1.21.11

      - name: Copy BytecodeAnalyser to nms-common build folder
        run: mv BytecodeAnalyser/build/libs/BytecodeAnalyser*.jar commandapi-platforms/commandapi-bukkit/commandapi-bukkit-nms/commandapi-bukkit-nms-common/build

      - name: Run BytecodeAnalyser
        run: |
            cd commandapi-platforms/commandapi-bukkit/commandapi-bukkit-nms/commandapi-bukkit-nms-common/build
            chmod +x BytecodeAnalyser*.jar
            java -jar BytecodeAnalyser*.jar

      ### Bukkit tests ###
      # The shared Bukkit tests run on Paper 26.3. The Spigot tests are only compiled, because Spigot's 26.x server
      # can't run with MockBukkit (see commandapi-spigot-test-tests/build.gradle.kts)

      - name: Run Paper unit tests (26.3)
        # continue-on-error: true
        run: ./gradlew :commandapi-paper-test-tests:clean :commandapi-paper-test-tests:test --rerun-tasks

      - name: Compile Spigot unit tests (26.3)
        run: ./gradlew :commandapi-spigot-test-tests:compileTestJava :commandapi-spigot-test-tests:compileTestKotlin

      ### Upload .jar artifacts ###

      - name: Upload CommandAPI (Spigot) plugin artifact
        if: ${{ runner.os == 'Linux' && matrix.java == '25' }} # Only upload artifacts built from latest java on one OS
        uses: actions/upload-artifact@v4
        with:
          name: CommandAPI (Spigot plugin)
          path: |
            commandapi-platforms/commandapi-spigot/commandapi-spigot-plugin/build/libs/commandapi-spigot-plugin-*.jar

      - name: Upload CommandAPI (Paper) plugin artifact
        if: ${{ runner.os == 'Linux' && matrix.java == '25' }} # Only upload artifacts built from latest java on one OS
        uses: actions/upload-artifact@v4
        with:
            name: CommandAPI (Paper plugin)
            path: |
              commandapi-platforms/commandapi-paper/commandapi-paper-plugin/build/libs/commandapi-paper-plugin-*.jar

      - name: Upload CommandAPI (Velocity) plugin artifact
        if: ${{ runner.os == 'Linux' && matrix.java == '25' }} # Only upload artifacts built from latest java on one OS
        uses: actions/upload-artifact@v4
        with:
          name: CommandAPI (Velocity plugin)
          path: |
            commandapi-platforms/commandapi-velocity/commandapi-velocity-plugin/build/libs/commandapi-velocity-plugin-*.jar

      ### Examples ###

#      - name: Build CommandAPI example plugins in examples/ folder
#        run: cd ./examples; ./build.sh;

      ### Save PR information for 'SonarAnalyze'
      - name: Save PR number to file
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.java == 25
        run: echo ${{ github.event.number }} > PR_NUMBER.txt
      - name: Archive PR number
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.java == 25
        uses: actions/upload-artifact@v4
        with:
            name: PR_NUMBER
            path: PR_NUMBER.txt

  snapshot-deploy:
    needs: build # Only run if "build" succeeds
    runs-on: ubuntu-latest
    if: github.repository == 'CommandAPI/CommandAPI' && github.ref == 'refs/heads/dev/dev'

    steps:
      - name: Checkout the CommandAPI repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Publish snapshot version of the CommandAPI (Bukkit+Velocity) to the Sonatype snapshot repository
        run: |
          if grep -E '^version=.*SNAPSHOT$' gradle.properties >/dev/null; then
            echo "SNAPSHOT version detected"
            ./gradlew publishToMavenCentral
          else
            echo "Version is not a SNAPSHOT version, not deploying to Sonatype Snapshot repo"
          fi
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_SONATYPE_PASSWORD }}
